# Analyse SonarCloud du socle QA.
#
# IMPORTANT (correctif) : la version précédente ne faisait QUE lancer le scanner CLI, sans
# `actions/checkout` ni build Maven → 0 fichier indexé, aucune analyse Java, Quality Gate
# toujours vert par vacuité. On checkout le dépôt, on BUILD (compile + tests → classes
# nécessaires à l'analyseur Java) puis on lance l'analyse via le plugin Maven Sonar, qui
# auto-détecte sources, tests, binaires et dépendances.
#
# Prérequis : secret `SONAR_TOKEN` (Settings > Secrets > Actions).

name: SonarCloud analysis

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  pull-requests: read # permet à SonarCloud de décorer les PR

jobs:
  Analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique complet : blame + calcul du « new code »

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      # test-compile : produit target/classes ET target/test-classes (binaires requis par
      # l'analyseur Java de Sonar) SANS exécuter les tests — inutile ici, et ça éviterait
      # d'instancier un WebDriver / lancer un navigateur absent du runner. Les tests
      # comportementaux (navigateur) relèvent du projet consommateur qa-test.
      - name: Compilation et analyse SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw -B test-compile sonar:sonar
          -Dsonar.projectKey=ArnaudS-A5_qa-template
          -Dsonar.organization=arnauds-a5
          -Dsonar.host.url=https://sonarcloud.io
